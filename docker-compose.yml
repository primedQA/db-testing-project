services:
  db:
    image: postgres:16
    container_name: qa-db
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: